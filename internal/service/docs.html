<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MetaTube API</title><style>
:root{color-scheme:light dark;font:16px/1.6 system-ui}body{max-width:1040px;margin:48px auto;padding:0 24px}a{color:#168c87}header{border-bottom:1px solid #8885;padding-bottom:24px}h1{font-size:42px;letter-spacing:-1px;margin-bottom:8px}small{color:#888}article{border:1px solid #8885;border-radius:12px;padding:20px;margin:20px 0}code,pre{font-family:ui-monospace,monospace}pre{background:#8881;padding:16px;overflow:auto;border-radius:8px}label{display:block;margin:12px 0}input{padding:8px;width:min(550px,90%);border:1px solid #8886;border-radius:5px}button{padding:9px 20px;background:#117e77;color:white;border:0;border-radius:6px;cursor:pointer}summary{cursor:pointer}h2 code{font-size:16px}#notice{padding:12px 0}footer{margin:40px 0}</style>
<header><small>METATUBE · API v1</small><h1>清晰的元数据接口</h1><p>影片、演员与封面图片。兼容 Jellyfin MetaTube 插件。成功返回 <code>{"data":…}</code>，失败返回 <code>{"error":{"code":400,"message":"…"}}</code>。</p><a href="/openapi.json">下载 OpenAPI 3.0 文档</a><label>API Token（仅保存在本页内存，不写入浏览器存储）<br><input id="token" type="password" autocomplete="off" placeholder="仅受保护接口需要"></label><p>图片接口保持公开以兼容 Jellyfin 图片下载。默认删除 1080P 与蓝光分类；只匹配完整分类名称，不改动标题。元数据不向 CDN 缓存。</p></header><main id="endpoints">正在加载接口文档…</main><section><h2>数据模型</h2><div id="schemas"></div></section><footer>示例请求会访问当前服务。请求第三方数据源可能需要数秒；失败不会缓存为图片。</footer><script>
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
fetch('/openapi.json').then(r=>r.json()).then(spec=>{
const root=document.querySelector('#endpoints');root.textContent='';
for(const [path,methods]of Object.entries(spec.paths)){for(const [method,op]of Object.entries(methods)){if(method!=='get')continue;const a=el('article');a.append(el('h2',method.toUpperCase()+' '+path),el('p',op.summary),el('p',op.description||''));const fields=[];for(let p of op.parameters||[]){if(p.$ref)p=spec.components.parameters[p.$ref.split('/').pop()];const label=el('label',p.name+(p.required?' *':'')+' — '+(p.description||''));const input=el('input');input.placeholder=String(p.schema.default??p.example??'');label.append(el('br'),input);a.append(label);fields.push([p,input])}const detail=el('details');detail.append(el('summary','响应与错误定义'));detail.append(el('pre',JSON.stringify(op.responses,null,2)));a.append(detail);const button=el('button','发送 GET 请求');const output=el('pre','尚未发送请求');button.onclick=async()=>{let url=path;const q=new URLSearchParams();for(const[p,input]of fields){const value=input.value;if(p.required&&!value){output.textContent='请填写 '+p.name;return}if(p.in==='path')url=url.replace('{'+p.name+'}',encodeURIComponent(value));else if(value)q.set(p.name,value)}button.disabled=true;output.textContent='请求中…';try{const headers={};if(op.security?.length&&document.querySelector('#token').value)headers.Authorization='Bearer '+document.querySelector('#token').value;const r=await fetch(url+(q.size?'?'+q:''),{headers});if(r.headers.get('content-type')?.startsWith('image/')){const blob=await r.blob();output.textContent=r.status+' '+r.headers.get('content-type')+' · '+blob.size+' bytes · X-Cache: '+r.headers.get('x-cache');}else{const text=await r.text();try{output.textContent=r.status+'\n'+JSON.stringify(JSON.parse(text),null,2)}catch{output.textContent=r.status+'\n'+text}}}catch{output.textContent='请求失败'}finally{button.disabled=false}};a.append(button,output);root.append(a)}}
for(const[name,schema]of Object.entries(spec.components.schemas)){const d=el('details');d.append(el('summary',name),el('pre',JSON.stringify(schema,null,2)));document.querySelector('#schemas').append(d)}
}).catch(()=>{document.querySelector('#endpoints').textContent='文档加载失败，请重试。'});
</script></html>
