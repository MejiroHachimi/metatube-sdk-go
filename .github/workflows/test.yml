name: Service validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -coverprofile=coverage.out ./internal/service ./imageutil ./database ./engine/dbengine
      - run: go tool cover -func=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage.out
      - run: CGO_ENABLED=0 go test -tags=nodynamic ./imageutil ./internal/service
      - run: CGO_ENABLED=0 go build ./...
      - run: docker build -t metatube:test .
      - run: python3 scripts/smoke.py metatube:test
