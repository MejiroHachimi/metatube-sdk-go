services:
  metatube:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - metadata:/data
    environment:
      TOKEN: ${TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  metadata:
